name: 💡 功能建议 / Feature Request
description: 提出新功能或改进建议 / Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 描述你遇到的场景或痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed solution
      description: 你期望的行为或界面
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
  - type: checkboxes
    id: scope
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 我已确认这不是 OpenTTD 游戏本体的问题 / This is about the launcher, not the game
          required: true
