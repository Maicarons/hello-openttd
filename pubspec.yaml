name: hello_openttd
description: "hello-openttd — a modern OpenTTD launcher (versions, mirrors, mods, config, saves)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^17.5.0
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  archive: ^4.2.0
  crypto: ^3.0.7
  yaml: ^3.1.4
  path: ^1.9.1
  chinese_font_library: ^1.3.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
